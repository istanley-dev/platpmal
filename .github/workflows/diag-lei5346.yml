name: Diagnose Lei 5346 source

on:
  push:
    branches: [main]
    paths:
      - 'scripts/diag_lei5346_occurrences.py'
      - '.github/workflows/diag-lei5346.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pypdf
      - run: python3 scripts/diag_lei5346_occurrences.py
