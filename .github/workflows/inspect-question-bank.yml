name: Inspect Question Bank

on:
  push:
    paths:
      - 'scripts/inspect_question_bank_structure.py'
      - '.github/workflows/inspect-question-bank.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect question bank structure
        run: python scripts/inspect_question_bank_structure.py
