name: Audit law bank

on:
  push:
    paths:
      - 'scripts/audit_law_bank_extract.py'
      - '.github/workflows/audit-law-bank.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract law bank links
        run: python3 scripts/audit_law_bank_extract.py
      - name: Commit audit extract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add law-bank-extract.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: refresh law bank extract"
          git push
