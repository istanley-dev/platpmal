name: Inspect law bank links

on:
  push:
    paths:
      - 'scripts/fix_law_link_fallback.py'
      - 'scripts/fix_law_parser_v2.py'
      - 'scripts/fix_law_parser_v21.py'
      - 'scripts/apply_dso_law_cycles.py'
      - 'scripts/audit_dso_law_cycles.py'
      - 'scripts/generate_full_law_reading.py'
      - 'scripts/apply_full_law_reader.py'
      - 'scripts/audit_full_law_reader.py'
      - 'scripts/audit_law_runtime.py'
      - 'scripts/find_orphan_question_candidates.py'
      - 'scripts/summarize_orphan_candidates.py'
      - 'scripts/classify_law_orphans.py'
      - 'scripts/inspect_question_lookup_usage.py'
      - 'scripts/inspect_law_review_functions.py'
      - '.github/workflows/inspect-cycle.yml'
  pull_request:
    paths:
      - 'scripts/fix_law_link_fallback.py'
      - 'scripts/fix_law_parser_v2.py'
      - 'scripts/fix_law_parser_v21.py'
      - 'scripts/apply_dso_law_cycles.py'
      - 'scripts/audit_dso_law_cycles.py'
      - 'scripts/generate_full_law_reading.py'
      - 'scripts/apply_full_law_reader.py'
      - 'scripts/audit_full_law_reader.py'
      - 'scripts/audit_law_runtime.py'
      - 'scripts/find_orphan_question_candidates.py'
      - 'scripts/summarize_orphan_candidates.py'
      - 'scripts/classify_law_orphans.py'
      - 'scripts/inspect_question_lookup_usage.py'
      - 'scripts/inspect_law_review_functions.py'
      - '.github/workflows/inspect-cycle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Ensure safe fallback exists
        run: python3 scripts/fix_law_link_fallback.py
      - name: Ensure parser v2 exists
        run: python3 scripts/fix_law_parser_v2.py
      - name: Harden parser to v2.1
        run: python3 scripts/fix_law_parser_v21.py
      - name: Apply DSO law reading cycles
        run: python3 scripts/apply_dso_law_cycles.py
      - name: Install full law reader dependencies
        run: pip install requests beautifulsoup4 pypdf
      - name: Generate integral DSO law reading
        run: python3 scripts/generate_full_law_reading.py
      - name: Apply integral law reader UI
        run: python3 scripts/apply_full_law_reader.py
      - name: Audit integral law reader
        run: python3 scripts/audit_full_law_reader.py
      - name: Audit DSO law reading cycles
        run: python3 scripts/audit_dso_law_cycles.py
      - name: Runtime-audit actual parser against full bank
        run: python3 scripts/audit_law_runtime.py
      - name: Find existing questions for orphan law cards
        run: python3 scripts/find_orphan_question_candidates.py
      - name: Summarize strong candidates
        run: python3 scripts/summarize_orphan_candidates.py
      - name: Classify true coverage gaps
        run: python3 scripts/classify_law_orphans.py
      - name: Inspect question lookup paths
        run: python3 scripts/inspect_question_lookup_usage.py
      - name: Inspect law-review retrieval
        run: python3 scripts/inspect_law_review_functions.py
      - name: Commit platform and diagnostic reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html law-reading/ law-reading-audit.json law-cycle-audit.json law-bank-runtime-audit.json law-bank-orphan-candidates.json law-bank-strong-candidates.json law-bank-gap-classification.json question-lookup-usage.txt law-review-functions.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add integral DSO law reading to bank"
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin HEAD:"$BRANCH"
