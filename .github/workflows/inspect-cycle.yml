name: Inspect new cycle flow

on:
  push:
    paths:
      - 'scripts/fix_law_link_fallback.py'
      - 'scripts/audit_law_fallback.py'
      - '.github/workflows/inspect-cycle.yml'
  pull_request:
    paths:
      - 'scripts/fix_law_link_fallback.py'
      - 'scripts/audit_law_fallback.py'
      - '.github/workflows/inspect-cycle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Apply safe law-link fallback
        run: python3 scripts/fix_law_link_fallback.py
      - name: Measure effective links
        run: python3 scripts/audit_law_fallback.py
      - name: Commit platform and diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html law-bank-effective-links.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: apply safe fallback for law question links"
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin HEAD:"$BRANCH"
