name: Inspect law bank links

on:
  push:
    paths:
      - 'scripts/fix_law_link_fallback.py'
      - 'scripts/fix_law_parser_v2.py'
      - 'scripts/fix_law_parser_v21.py'
      - 'scripts/audit_law_runtime.py'
      - '.github/workflows/inspect-cycle.yml'
  pull_request:
    paths:
      - 'scripts/fix_law_link_fallback.py'
      - 'scripts/fix_law_parser_v2.py'
      - 'scripts/fix_law_parser_v21.py'
      - 'scripts/audit_law_runtime.py'
      - '.github/workflows/inspect-cycle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Ensure safe fallback exists
        run: python3 scripts/fix_law_link_fallback.py
      - name: Ensure parser v2 exists
        run: python3 scripts/fix_law_parser_v2.py
      - name: Harden parser to v2.1
        run: python3 scripts/fix_law_parser_v21.py
      - name: Runtime-audit actual parser against full bank
        run: python3 scripts/audit_law_runtime.py
      - name: Commit platform and runtime audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html law-bank-runtime-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: harden law-bank article links to parser v2.1"
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin HEAD:"$BRANCH"
