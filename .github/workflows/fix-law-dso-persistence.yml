name: Fix Banco de Leis progress persistence

on:
  push:
    paths:
      - 'scripts/apply_law_dso_persistence_fix.py'
      - '.github/workflows/fix-law-dso-persistence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply isolated persistence fix
        run: python3 scripts/apply_law_dso_persistence_fix.py

      - name: Verify patch and preserve existing DSO code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'PMAL_LAW_DSO_PERSISTENCE_V1',
            "var KEY = 'pmal26_law_dso_persistence_v1'",
            'state.lawDso = saved.lawDso',
            'state.lawDsoReadingV3 = saved.lawDsoReadingV3',
            'var originalSS = SS',
            'SS = wrappedSS',
            'window.addEventListener(\'pagehide\', persistLawState)',
            'window.completeDsoLawDay=function'
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Patch incompleto: '+', '.join(missing))
          if s.count('PMAL_LAW_DSO_PERSISTENCE_V1') != 2:
              raise SystemExit('Marcadores da persistência ausentes ou duplicados.')
          print('OK: persistência lateral instalada; código do avanço preservado.')
          PY

      - name: Commit and publish
        run: |
          if git diff --quiet -- index.html; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: persist DSO law cycle and reading cards across reloads"
          git push
