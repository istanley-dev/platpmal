name: Audit technical comments

on:
  push:
    paths:
      - '.github/workflows/comment-audit.yml'
      - 'scripts/audit_comments.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run comment audit
        run: python3 scripts/audit_comments.py

      - name: Commit audit report
        run: |
          if git diff --quiet -- comment-audit-report.json comment-audit-report.jsonl \
             && git ls-files --error-unmatch comment-audit-report.json >/dev/null 2>&1 \
             && git ls-files --error-unmatch comment-audit-report.jsonl >/dev/null 2>&1; then
            echo "Audit reports unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comment-audit-report.json comment-audit-report.jsonl
          git commit -m "chore: refresh technical comment audit"
          git push
